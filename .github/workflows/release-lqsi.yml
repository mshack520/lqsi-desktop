name: 构建并发布 LQ SI（手动触发）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（必须大于当前 0.12.28，例如 0.12.29）'
        required: true
        default: '0.12.29'

permissions:
  contents: write

env:
  LQSI_REPO: mshack520/lqsi-desktop

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 设置版本号
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: 应用品牌（名称/图标/启动动画/插件）
        run: node scripts/apply-lqsi-brand.mjs

      - name: 修品牌细节（安装目录/首启文案/模型列表）
        run: node scripts/apply-lqsi-fixes.mjs

      - name: 把更新源改到本仓库
        run: node scripts/patch-update-source.mjs --repo "$env:LQSI_REPO"

      - name: 接入原生启动舞台（动画/身份确认/启动口令/设置页）
        run: node scripts/apply-lqsi-startup.mjs

      - name: 链接本地插件
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 构建前端与主进程
        run: npm run build

      - name: 统一界面文案（DSH Desktop / dataelem → LQ SI）
        run: node scripts/apply-lqsi-copy.mjs

      - name: 打包 Windows 安装包（不签名、不自动发布）
        run: node scripts/electron-builder-windows.mjs --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 打包自检（缺东西直接失败，不发布）
        shell: bash
        run: |
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar | head -40 || true
          node scripts/verify-build.mjs
          echo "---- verify.txt ----"
          cat dist/verify.txt

      - name: 生成版本目录 versions.json
        shell: bash
        run: node scripts/make-versions-json.mjs

      - name: 列出产物
        shell: bash
        run: ls -lh dist | head -30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: LQ SI v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/latest.yml
            dist/versions.json
            dist/verify.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 写更新策略 policy.json 并提交（放在 Release 之后，保证下载地址已存在）
        shell: bash
        run: |
          # Release 可从功能分支构建；更新策略必须基于 main 最新提交，不能把功能分支直接推到 main。
          git fetch origin main
          git checkout --detach origin/main
          node -e "const fs=require('fs');const v=process.argv[1];fs.mkdirSync('updates',{recursive:true});const p={updateAvailable:true,version:v,feedUrl:'https://github.com/'+process.env.LQSI_REPO+'/releases/download/v'+v+'/'};fs.writeFileSync('updates/policy.json',JSON.stringify(p,null,2)+'\n')" "${{ inputs.version }}"
          cat updates/policy.json
          git config user.name "lqsi-release-bot"
          git config user.email "lqsi-bot@users.noreply.github.com"
          git add updates/policy.json
          if git diff --cached --quiet; then
            echo "policy.json 无变化"
          else
            git commit -m "chore(update): point rollout to v${{ inputs.version }}"
            git push origin HEAD:main
          fi
