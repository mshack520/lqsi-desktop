<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LQ SI 启动动画设置</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e8eaf0; --muted:#9aa2b1; --accent:#d92d39; }
  * { box-sizing: border-box; }
  body { margin:0; padding:22px 24px 96px; background:var(--bg); color:var(--text);
         font:14px/1.6 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.hint { margin:0 0 18px; color:var(--muted); font-size:13px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  section h2 { font-size:13px; font-weight:600; color:var(--muted); margin:0 0 12px; letter-spacing:.4px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px 16px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input[type=text], input[type=number], input[type=password], select {
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:#11141a; color:var(--text); font-size:13px; }
  input[type=color] { width:100%; height:36px; border:1px solid var(--line); border-radius:8px; background:#11141a; }
  .switch { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .actions { position:fixed; left:0; right:0; bottom:0; padding:12px 24px; background:#0b0d12;
             border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  button { padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:#1d222c;
           color:var(--text); font-size:13px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .status { margin-left:auto; color:var(--muted); font-size:12px; }
  .status.err { color:#ff7b7b; }
  .status.ok { color:#6ee7a8; }
</style>
</head>
<body>
  <h1>启动动画设置</h1>
  <p class="hint">这里改的就是启动时播放的那段动画与身份卡；设置保存在你的用户目录，升级安装不会丢。</p>

  <section>
    <h2>播放</h2>
    <div class="grid">
      <div>
        <label>是否播放</label>
        <select id="enabled"><option value="true">播放</option><option value="false">不播放</option></select>
      </div>
      <div>
        <label>播放时机</label>
        <select id="mode">
          <option value="always">每次启动</option>
          <option value="first">每次运行一次</option>
        </select>
      </div>
      <div>
        <label>配色</label>
        <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select>
      </div>
      <div>
        <label>速度倍率（0.5–2）</label>
        <input type="number" id="speed" min="0.5" max="2" step="0.1" />
      </div>
    </div>
  </section>

  <section>
    <h2>身份与文案</h2>
    <div class="grid">
      <div><label>身份</label><input type="text" id="identity" /></div>
      <div><label>身份编号</label><input type="text" id="identityId" /></div>
      <div><label>权限等级</label><input type="text" id="accessLevel" /></div>
      <div><label>欢迎条</label><input type="text" id="welcomeBox" /></div>
      <div><label>品牌行 1</label><input type="text" id="brand1" /></div>
      <div><label>品牌行 2</label><input type="text" id="brand2" /></div>
      <div><label>机构（中文）</label><input type="text" id="orgZh" /></div>
      <div><label>机构（英文）</label><input type="text" id="orgEn" /></div>
      <div><label>页脚</label><input type="text" id="footer" /></div>
      <div><label>主色</label><input type="color" id="accent" /></div>
    </div>
  </section>

  <section>
    <h2>启动口令与免登录</h2>
    <div class="grid">
      <div><label>当前口令（首次默认 mshack）</label><input type="password" id="curPass" /></div>
      <div><label>新口令</label><input type="password" id="newPass" /></div>
    </div>
    <div class="switch">
      <input type="checkbox" id="autoLogin" />
      <label for="autoLogin" style="margin:0">开机自动启动 LQ SI</label>
    </div>
    <div style="margin-top:12px"><button id="btnPass">修改口令</button></div>
  </section>

  <div class="actions">
    <button class="primary" id="btnSave">保存</button>
    <button id="btnPreview">预览动画</button>
    <button id="btnReset">恢复默认</button>
    <span class="status" id="status"></span>
  </div>

<script>
  const FIELDS = ['enabled','mode','theme','speed','identity','identityId','accessLevel','welcomeBox',
                  'brand1','brand2','orgZh','orgEn','footer','accent']
  const el = (id) => document.getElementById(id)
  const status = (text, kind) => { const s = el('status'); s.textContent = text; s.className = 'status ' + (kind || '') }

  async function load() {
    const result = await window.lqsiStartup.read()
    if (!result || result.ok !== true) { status('读取配置失败', 'err'); return }
    const config = result.config || {}
    for (const key of FIELDS) {
      const node = el(key)
      if (!node) continue
      const value = config[key]
      if (node.type === 'checkbox') node.checked = value === true
      else if (node.tagName === 'SELECT') node.value = String(value ?? '')
      else node.value = value ?? ''
    }
    const auth = await window.lqsiStartup.authSettings()
    el('autoLogin').checked = auth?.autoLogin === true
    status('已读取：' + (result.file || ''))
  }

  function collect() {
    const patch = {}
    for (const key of FIELDS) {
      const node = el(key)
      if (!node) continue
      if (key === 'enabled') patch.enabled = node.value === 'true'
      else if (key === 'speed') patch.speed = Number(node.value) || 1
      else patch[key] = node.value
    }
    return patch
  }

  el('btnSave').onclick = async () => {
    const result = await window.lqsiStartup.save(collect())
    status(result?.ok ? '已保存，下次启动生效' : '保存失败', result?.ok ? 'ok' : 'err')
  }
  el('btnPreview').onclick = async () => { status('正在预览…'); await window.lqsiStartup.preview(); status('预览已播放', 'ok') }
  el('btnReset').onclick = async () => {
    if (!confirm('恢复为默认设置？口令和自动启动开关会保留。')) return
    await window.lqsiStartup.reset(); await load(); status('已恢复默认', 'ok')
  }
  el('btnPass').onclick = async () => {
    const result = await window.lqsiStartup.changePasscode(el('curPass').value, el('newPass').value)
    if (result?.ok) { el('curPass').value = ''; el('newPass').value = ''; status('口令已修改', 'ok') }
    else status(result?.error || '修改失败', 'err')
  }
  el('autoLogin').onchange = async () => {
    const result = await window.lqsiStartup.setAutoLogin(el('autoLogin').checked)
    status(result?.ok ? '开机自动启动已更新' : '设置失败', result?.ok ? 'ok' : 'err')
  }
  load()
</script>
</body>
</html>
